# AI-DOS Model Registry
#
# IMPORTANT
# - Every entry in this file is an EXAMPLE (status: example). Examples
#   illustrate the schema. They are NOT architecture, NOT recommendations and
#   NOT verified facts. Model names were supplied as illustrative examples;
#   their existence, provider, version and properties have not been verified.
# - Unverified values are `unknown`. Never fill in context sizes, prices or
#   benchmark results without evidence (see verification block).
# - Entries with status `example` are never selectable by routing.
# - Workflows and roles never reference entries here by name; they reference
#   capabilities (see capabilities.yaml and selection-policy.md).
#
# Field reference
#   id                  stable registry id (kebab-case), not the vendor name
#   provider            openai | anthropic | google | cursor | local | self_hosted | other | unknown
#   name, version       vendor product name and exact version string, or unknown
#   status              example | discovered | candidate | evaluated | approved | preferred | deprecated | retired
#   deployment          hosted | local | self_hosted | unknown
#   capabilities        map of capability id -> level (ids and levels from capabilities.yaml)
#   context.size        token count as verified number, or unknown
#   performance         speed: unknown|slow|medium|fast ; quality, reliability: capability level
#   economics.cost_class  unknown | low | medium | high
#   tools               filesystem/terminal/browser/git: unknown | yes | no (in the integration used)
#   data_policy         max_data_sensitivity (set by a human at approval): unknown | public | internal | confidential | restricted
#                       training_on_inputs, retention: unknown | <verified statement>
#   preferred_roles     intended roles (role ids); a hint for evaluation, not a verified fit, never used for eligibility
#   approved_roles      roles a human approved this model for (set at status `approved`); used by routing eligibility
#   limitations, notes  free text
#   evaluation          hallucination_rate: unknown|low|medium|high ; last_report: path or null
#   verification        verified_by, verified_at (ISO date), evidence (list of links/report paths)
#                       Empty verification => every value in the entry is unverified.

