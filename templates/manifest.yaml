# Embedded AI-DOS Manifest (template)
# Copy to .ai-dos/manifest.yaml during initialization (integration/initialize.md).
# .ai-dos/install.ps1 creates it from this template if it is missing (version
# from .ai-dos/VERSION, integrated_at = today) and never rewrites it except the
# version and updated_at lines during -Update.
# Schema: integration/manifest.schema.yaml. Installation and provenance only;
# project identity, security and model restrictions belong in project-profile.yaml.
# Never put credentials, API keys, tokens or secrets in this file.

schema_version: 1
ai_dos:
  version: "0.1.0"                 # project AI-DOS version (pinned)
  source:
    version: "0.1.0"               # source AI-DOS version copied in the last initialize/update
    ref: unknown                   # master tag or commit, e.g. v0.1.0
    repository: "Central AI-DOS"   # descriptive name only; no path, no URL with credentials
  integrated_at: YYYY-MM-DD
  updated_at: null
project_profile: project-profile.yaml
integration:
  mode: embedded
  root: .ai-dos
  managed:
    - .ai-dos/governance/
    - .ai-dos/orchestration/
    - .ai-dos/skills/
    - .ai-dos/templates/
    - .ai-dos/checklists/
    - .ai-dos/integration/
    - .ai-dos/VERSION
    - .ai-dos/install.ps1
  tools:                           # tool adapter sets generated by install.ps1 (always all)
    - cursor
    - claude-code
    - codex
    - github-copilot
  generated:
    - .ai-dos/manifest.yaml
    - .cursor/rules/00-governance.mdc
    - .cursor/rules/01-working-method.mdc
    - .cursor/rules/02-code-quality.mdc
    - .cursor/rules/03-architecture.mdc
    - .cursor/rules/04-security.mdc
    - .cursor/rules/05-testing.mdc
    - .cursor/rules/06-dependencies.mdc
    - .cursor/rules/07-git.mdc
    - .cursor/rules/08-documentation.mdc
    - .cursor/rules/09-ai-safety.mdc
    - .cursor/rules/10-review.mdc
    - .cursor/rules/11-orchestration.mdc
    - .cursor/commands/            # AI-DOS commands only (same file names as in the master)
    - .agents/skills/aidos-*/      # shared skill adapters (Cursor, Codex, Copilot) of enabled skills
    - .claude/rules/aidos-*.md     # Claude Code path-scoped rules (glob rules)
    - .claude/commands/aidos-*.md  # Claude Code commands and skill adapters
    - .github/instructions/aidos-*.instructions.md  # Copilot path-specific instructions
    - .github/prompts/aidos-*.prompt.md             # Copilot prompt files (commands)
    - AGENTS.md                    # only the block between the ai-dos markers
    - CLAUDE.md                    # only the block between the ai-dos markers
    - .github/copilot-instructions.md  # only the block between the ai-dos markers
    - .gitignore                   # only the AI-DOS block
  # .claude/settings.json is created once by install.ps1 and is project-owned afterwards
  local_modifications: []
  # example:
  #   - path: .cursor/rules/02-code-quality.mdc
  #     change: "globs limited to **/*.ts, **/*.html"
  #     reason: "Angular-only project"
  #     approval: APR-YYYYMMDD-NNN
compatibility:
  minimum_ai_dos_version: "0.1.0"
  maximum_ai_dos_version: null
governance:
  profile: standard
features:                          # must stay false in 0.x; nothing implements them
  orchestration: false
  automated_routing: false
  automated_skill_selection: false
migrations: []
