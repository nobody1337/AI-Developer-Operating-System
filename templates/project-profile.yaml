# AI-DOS Project Profile (template)
# Status: Governance Definition / configuration convention. No tool reads this
# file automatically today; agents read it by convention (referenced from the
# project's AGENTS.md). Place it at the root of a consuming project as
# `ai-dos.project.yaml`.
#
# Project rules rank 5 in the governance hierarchy (above AI-DOS governance,
# rank 6). They may add or tighten rules but MUST NOT weaken the Security
# Baseline (governance/principles/governance-hierarchy.md).

schema_version: 1
project:
  name: <project name>
  owner: <human owner / team>
  ai_dos_path: ai-dos            # where AI-DOS lives in this repo (copy or submodule); "." if this IS the AI-DOS repo
  ai_dos_version: <commit or tag>

defaults:
  data_sensitivity: internal     # public | internal | confidential | restricted

risk_overrides:                  # additional mappings; may only RAISE risk
  - match: "src/billing/**"
    minimum_risk: CRITICAL
  - match: "src/auth/**"
    minimum_risk: HIGH

approved_models: []              # registry ids approved for this project (subset of the AI-DOS registry or a project registry)
# example:
#   - id: <registry id>
#     roles: [frontend-developer]
#     max_data_sensitivity: internal

commands:                        # the real project commands agents should use
  build: <e.g. npm run build>
  test: <e.g. npm test -- --watch=false>
  lint: <e.g. npm run lint>

approvers:                       # who may approve gates (informational; real enforcement via repo tooling)
  - <name or handle>

additional_rules: []             # paths to project-specific rule documents
